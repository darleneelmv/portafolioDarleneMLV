# Panel de administración (Decap CMS)
# Se abre en: https://TU-SITIO.netlify.app/entrar/
backend:
  name: git-gateway
  branch: main
  commit_messages:
    update: "Panel: actualiza {{slug}}"
    uploadMedia: "Panel: sube {{path}}"
    deleteMedia: "Panel: borra {{path}}"

locale: es
publish_mode: simple
media_folder: media
public_folder: media
site_url: /
display_url: /

collections:
  - name: sitio
    label: "Mi portafolio"
    description: "Todo lo que se ve en tu portafolio. Al dar Publicar, la página se actualiza en 1 o 2 minutos. Cada publicación gasta créditos de Netlify: junta varios cambios antes de publicar."
    editor:
      preview: false
    files:

      # ------------------------------------------------------------ PERFIL
      - name: perfil
        label: "👤 Perfil y portada"
        file: contenido/perfil.json
        fields:
          - { name: nombre, label: "Nombre", widget: string }
          - { name: apellido, label: "Apellidos", widget: string }
          - { name: nombre_completo, label: "Nombre completo", widget: string, required: false }
          - { name: iniciales, label: "Iniciales (logo)", widget: string, required: false }
          - { name: disponibilidad, label: "Aviso de disponibilidad", widget: string, required: false, hint: "Déjalo vacío para ocultarlo." }
          - { name: saludo, label: "Saludo grande", widget: string, hint: "Tu nombre sale en rojo." }
          - { name: rol, label: "Rol (debajo del saludo)", widget: string }
          - { name: intro, label: "Presentación breve", widget: text }
          - { name: foto, label: "Foto principal", widget: image, required: false, hint: "Vertical. Se recorta en forma de arco." }
          - { name: palabra_fondo, label: "Palabra gigante del fondo", widget: string, required: false }
          - { name: sello, label: "Texto del sello que gira", widget: string, required: false }
          - { name: stickers, label: "Etiquetas que se arrastran", widget: list, field: { name: s, label: "Etiqueta", widget: string }, hint: "Máximo 8, cortitas." }
          - { name: cinta1, label: "Cinta roja", widget: list, field: { name: p, label: "Texto", widget: string } }
          - { name: cinta2, label: "Cinta negra", widget: list, field: { name: p, label: "Texto", widget: string } }
          - { name: boton_1, label: "Botón 1", widget: string }
          - { name: boton_2, label: "Botón 2 (descarga el CV)", widget: string }
          - { name: cv, label: "CV en PDF", widget: file, required: false, hint: "Sube tu CV actualizado en PDF." }
          - { name: ubicacion, label: "Ubicación", widget: string, required: false }
          - { name: escuela, label: "Escuela y semestre", widget: string, required: false }
          - { name: correo, label: "Correo", widget: string }
          - { name: telefono, label: "Teléfono (como se muestra)", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp (con 52, solo números)", widget: string, required: false }
          - { name: github, label: "Link de GitHub", widget: string, required: false }
          - { name: linkedin, label: "Link de LinkedIn", widget: string, required: false }
          - { name: vitrina_titulo, label: "Título de la ventana de proyectos", widget: string, required: false }
          - { name: vitrina_texto, label: "Texto bajo el título", widget: string, required: false }
          - name: ventana
            label: "Pestañas de la ventana de proyectos"
            label_singular: "pestaña"
            widget: list
            summary: "{{fields.pestana}}"
            fields:
              - { name: pestana, label: "Nombre de la pestaña", widget: string }
              - { name: imagen, label: "Captura", widget: image }
              - { name: texto, label: "Descripción corta", widget: string }
              - { name: etiqueta, label: "Etiqueta", widget: string, required: false, hint: "Ej. Cliente real, Servicio social, Proyecto personal" }
              - { name: destino, label: "Link de «Ver más»", widget: string, required: false, hint: "#destacado, #experiencia, #proyectos o un link completo" }

      # ------------------------------------------------------------ EXPERIENCIA
      - name: experiencia
        label: "💼 Experiencia"
        file: contenido/experiencia.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: subtitulo, label: "Subtítulo", widget: string, required: false }
          - name: puestos
            label: "Experiencias"
            label_singular: "experiencia"
            widget: list
            summary: "{{fields.organizacion}} · {{fields.periodo}}"
            hint: "La primera es la más reciente. Si el periodo dice «En curso», el punto sale en rosa."
            fields:
              - { name: organizacion, label: "Empresa o negocio", widget: string }
              - { name: puesto, label: "Puesto o tipo", widget: string }
              - { name: periodo, label: "Periodo", widget: string, hint: "Ej. Ago – Dic 2026, En curso" }
              - { name: lugar, label: "Lugar", widget: string, required: false }
              - { name: descripcion, label: "Descripción", widget: text }
              - { name: logros, label: "Logros", widget: list, field: { name: logro, label: "Logro", widget: text } }
              - { name: tecnologias, label: "Tecnologías", widget: list, field: { name: tec, label: "Tecnología", widget: string } }
              - { name: imagen, label: "Captura", widget: image, required: false }
              - { name: pie_imagen, label: "Texto bajo la captura", widget: string, required: false }
              - { name: link, label: "Link", widget: string, required: false }
              - { name: link_texto, label: "Texto del link", widget: string, required: false }

      # ------------------------------------------------------------ CASO DESTACADO
      - name: destacado
        label: "⭐ Caso destacado (Strong Gym)"
        file: contenido/destacado.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: contexto, label: "El reto", widget: text }
          - { name: solucion, label: "Lo que hicimos", widget: text }
          - name: numeros
            label: "Números grandes"
            widget: list
            summary: "{{fields.numero}} {{fields.texto}}"
            fields:
              - { name: numero, label: "Número", widget: number }
              - { name: texto, label: "Texto", widget: string }
          - name: arquitectura
            label: "Diagrama recepción ↔ nube"
            widget: object
            fields:
              - { name: local, label: "Recepción", widget: string }
              - { name: flujo, label: "Flecha", widget: string }
              - { name: nube, label: "Nube", widget: string }
          - name: capturas
            label: "Capturas"
            label_singular: "captura"
            widget: list
            summary: "{{fields.pie}}"
            fields:
              - { name: imagen, label: "Imagen", widget: image }
              - { name: pie, label: "Descripción", widget: string }
          - name: funciones
            label: "Funciones"
            label_singular: "función"
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: "Texto", widget: text }
          - name: ficha
            label: "Ficha técnica"
            widget: list
            summary: "{{fields.dato}}"
            fields:
              - { name: dato, label: "Dato", widget: string }
              - { name: valor, label: "Valor", widget: string }
          - { name: nota, label: "Nota", widget: string, required: false }
          - { name: link, label: "Link", widget: string, required: false }
          - { name: link_texto, label: "Texto del botón", widget: string, required: false }

      # ------------------------------------------------------------ PROYECTOS
      - name: proyectos
        label: "🧩 Proyectos personales"
        file: contenido/proyectos.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: subtitulo, label: "Subtítulo", widget: string, required: false }
          - name: proyectos
            label: "Proyectos"
            label_singular: "proyecto"
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: "Nombre", widget: string }
              - { name: resumen, label: "Resumen (una línea)", widget: string }
              - { name: descripcion, label: "Qué hace (se abre al tocar)", widget: text, required: false }
              - { name: categorias, label: "Categorías (para los filtros)", widget: list, field: { name: cat, label: "Categoría", widget: string }, hint: "Usa siempre los mismos nombres: Web, Full stack, Nube e IA, Bases de datos…" }
              - { name: tecnologias, label: "Tecnologías", widget: list, field: { name: tec, label: "Tecnología", widget: string } }
              - { name: imagen, label: "Captura", widget: image, required: false, hint: "Si no hay captura, se muestra el texto de «Código de vista previa»." }
              - { name: codigo, label: "Código de vista previa", widget: text, required: false, hint: "Unas líneas de endpoints, SQL o comandos." }
              - { name: demo, label: "Link en vivo", widget: string, required: false }
              - { name: repo, label: "Link del código (GitHub)", widget: string, required: false }

      # ------------------------------------------------------------ HABILIDADES
      - name: habilidades
        label: "🛠️ Habilidades y formación"
        file: contenido/habilidades.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - name: grupos
            label: "Grupos de habilidades"
            label_singular: "grupo"
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: "Grupo", widget: string }
              - { name: items, label: "Habilidades", widget: list, field: { name: item, label: "Habilidad", widget: string } }
          - name: educacion
            label: "Formación"
            widget: object
            fields:
              - { name: carrera, label: "Carrera", widget: string }
              - { name: escuela, label: "Escuela", widget: string }
              - { name: periodo, label: "Periodo", widget: string }
              - { name: materias, label: "Materias destacadas", widget: text, required: false }
          - name: certificaciones
            label: "Certificaciones y cursos"
            label_singular: "certificación"
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: "Nombre", widget: string }
              - { name: emisor, label: "Quién la emite", widget: string }
              - { name: fecha, label: "Fecha", widget: string, required: false }
          - name: idiomas
            label: "Idiomas"
            widget: list
            summary: "{{fields.idioma}}"
            fields:
              - { name: idioma, label: "Idioma", widget: string }
              - { name: nivel, label: "Nivel", widget: string }

      # ------------------------------------------------------------ SOBRE MÍ
      - name: sobre_mi
        label: "💬 Sobre mí"
        file: contenido/sobre-mi.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: parrafos, label: "Párrafos", widget: list, field: { name: parrafo, label: "Párrafo", widget: text } }
          - name: fotos
            label: "Fotos (2)"
            widget: list
            max: 2
            summary: "{{fields.pie}}"
            fields:
              - { name: foto, label: "Foto", widget: image }
              - { name: pie, label: "Texto abajo de la foto", widget: string, required: false }
          - { name: intereses_titulo, label: "Título de intereses", widget: string }
          - { name: intereses, label: "Intereses", widget: list, field: { name: interes, label: "Interés", widget: string } }
          - { name: aprender_titulo, label: "Título de «quiero aprender»", widget: string }
          - { name: aprender, label: "Lo que quiero aprender", widget: list, field: { name: tema, label: "Tema", widget: string } }

      # ------------------------------------------------------------ LO QUE APORTO
      - name: aporto
        label: "✨ Lo que aporto"
        file: contenido/aporto.json
        fields:
          - { name: cita, label: "Frase grande", widget: text, hint: "Se ilumina palabra por palabra al bajar. Pon *palabras* entre asteriscos para que salgan en rojo." }
          - name: razones
            label: "Razones"
            label_singular: "razón"
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: "Texto", widget: text }

      # ------------------------------------------------------------ PROCESO
      - name: proceso
        label: "🧭 Cómo trabajo"
        file: contenido/proceso.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - name: pasos
            label: "Pasos"
            label_singular: "paso"
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: "Paso", widget: string }
              - { name: texto, label: "Texto", widget: text }

      # ------------------------------------------------------------ CONTACTO
      - name: contacto
        label: "📩 Contacto"
        file: contenido/contacto.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: subtitulo, label: "Subtítulo", widget: text }
          - { name: boton_copiar, label: "Botón copiar", widget: string }
          - { name: boton_escribir, label: "Botón escribir", widget: string }
          - { name: asunto, label: "Asunto del correo", widget: string }

      # ------------------------------------------------------------ DISEÑO
      - name: general
        label: "🎨 Diseño y secciones"
        file: contenido/general.json
        fields:
          - name: secciones
            label: "Secciones visibles"
            widget: object
            fields:
              - { name: vitrina, label: "Ventana de proyectos", widget: boolean, default: true }
              - { name: experiencia, label: "Experiencia", widget: boolean, default: true }
              - { name: destacado, label: "Caso destacado", widget: boolean, default: true }
              - { name: proyectos, label: "Proyectos personales", widget: boolean, default: true }
              - { name: habilidades, label: "Habilidades y formación", widget: boolean, default: true }
              - { name: sobre, label: "Sobre mí", widget: boolean, default: true }
              - { name: aporto, label: "Lo que aporto", widget: boolean, default: true }
              - { name: proceso, label: "Cómo trabajo", widget: boolean, default: true }
              - { name: contacto, label: "Contacto", widget: boolean, default: true }
          - name: colores
            label: "Colores"
            widget: object
            fields:
              - { name: tinta, label: "Negro (texto y secciones oscuras)", widget: color }
              - { name: rojo, label: "Rojo principal", widget: color }
              - { name: rosa, label: "Rosa (detalles)", widget: color }
              - { name: fondo, label: "Fondo claro", widget: color }
          - { name: boton_barra, label: "Botón de la barra de arriba", widget: string }
          - { name: pie, label: "Texto del pie de página", widget: string }
          - name: seo
            label: "Google y link compartido"
            widget: object
            fields:
              - { name: titulo, label: "Título de la pestaña", widget: string }
              - { name: descripcion, label: "Descripción", widget: text }
